<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>พื้นหลังดูดวง</title>
<style>
:root{--acc:#ffcf6b;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#000;color:#fff;font-family:"Sarabun","Noto Sans Thai",Tahoma,sans-serif}
#cv{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;touch-action:none}
#card{position:fixed;z-index:2;left:50%;top:max(12%,calc(env(safe-area-inset-top,0px) + 20px));transform:translateX(-50%);max-width:92vw;padding:14px 36px;text-align:center;border-radius:18px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 32px rgba(0,0,0,.5);pointer-events:none}
#card h1{font-size:clamp(22px,4.5vw,34px);font-weight:600;letter-spacing:.03em;text-shadow:0 0 18px var(--acc)}
#card p{font-size:clamp(12px,2vw,15px);opacity:.78;margin-top:4px}
#bar{position:fixed;z-index:3;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:14px 10px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.55))}
#bar button{font:inherit;font-size:14px;color:#fff;padding:8px 16px;border-radius:999px;cursor:pointer;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .25s,color .25s}
#bar button:hover{background:rgba(255,255,255,.22)}
#bar button.on{background:var(--acc);color:#1a0a00;border-color:transparent;font-weight:600}
#bar button:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style></head>
<body>
<canvas id="cv"></canvas>
<div id="card"><h1></h1><p></p></div>
<div id="bar"></div>
<script>
'use strict';
/* ================= Utils ================= */
const TAU=Math.PI*2,M=14; // M = margin (css px) of pre-rendered layers, used for parallax
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>v<a?a:v>b?b:v;
const mulberry=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const rnd=mulberry(20261101),rand=(a,b)=>a+(b-a)*rnd(); // seeded random
// value noise
const perm=new Uint8Array(512),vals=new Float32Array(256);
(()=>{const r=mulberry(11),a=[...Array(256).keys()];for(let i=255;i>0;i--){const j=r()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}for(let i=0;i<512;i++)perm[i]=a[i&255];for(let i=0;i<256;i++)vals[i]=r()})();
const H=(a,b)=>vals[perm[perm[a&255]+(b&255)]];
function noise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),a=H(xi,yi),b=H(xi+1,yi),c=H(xi,yi+1),d=H(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
const ENV={dpr:1,w:0,h:0,mobile:false,q:1,spd:1,reduced:matchMedia('(prefers-reduced-motion: reduce)').matches};
const lg=(g,x0,y0,x1,y1,s)=>{const r=g.createLinearGradient(x0,y0,x1,y1);for(const k of s)r.addColorStop(k[0],k[1]);return r};
const rg=(g,x0,y0,r0,x1,y1,r1,s)=>{const r=g.createRadialGradient(x0,y0,r0,x1,y1,r1);for(const k of s)r.addColorStop(k[0],k[1]);return r};
// cached soft glow sprites (additive light without per-frame gradients)
const SP={};
function spr(c){return SP[c]||(SP[c]=(()=>{const k=document.createElement('canvas');k.width=k.height=64;const g=k.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,`rgba(${c},1)`);r.addColorStop(.35,`rgba(${c},.35)`);r.addColorStop(1,`rgba(${c},0)`);g.fillStyle=r;g.fillRect(0,0,64,64);return k})())}
function glow(g,c,x,y,r,a){const o=g.globalAlpha;g.globalAlpha=a<0?0:a>1?1:a;g.drawImage(spr(c),x-r,y-r,r*2,r*2);g.globalAlpha=o}
function layer(w,h){const c=document.createElement('canvas'),d=ENV.dpr;c.width=(w+2*M)*d|0;c.height=(h+2*M)*d|0;const g=c.getContext('2d');g.scale(d,d);g.translate(M,M);c.g=g;return c}
const pl=(n,f)=>Array.from({length:Math.max(4,Math.round(n*ENV.q))},f); // particle pool sized by quality
function flame(g,x,y,s,f,lean){glow(g,'255,150,60',x,y-s*2,s*9,.5*f);g.globalAlpha=.9;g.fillStyle='#ff8a2a';g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x-s,y-s*1.6,x+lean*s,y-s*3.6*f);g.quadraticCurveTo(x+s,y-s*1.6,x,y);g.fill();g.fillStyle='#ffe9a0';g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x-s*.5,y-s*.9,x+lean*s*.5,y-s*2*f);g.quadraticCurveTo(x+s*.5,y-s*.9,x,y);g.fill();g.globalAlpha=1}
function rune(g,x,y,s,k){g.beginPath();g.moveTo(x,y-s);g.lineTo(x,y+s);g.moveTo(x,y+k[0]*s);g.lineTo(x+k[4]*s*.7,y+k[1]*s);g.moveTo(x,y+k[2]*s);g.lineTo(x+k[5]*s*.7,y+k[3]*s);g.stroke()}
function card(g,x,y,cw,ch,rot,col){g.save();g.translate(x,y);g.rotate(rot);g.fillStyle='#1b0a35';g.fillRect(-cw/2,-ch/2,cw,ch);g.strokeStyle=col;g.lineWidth=1.5;g.strokeRect(-cw/2,-ch/2,cw,ch);g.lineWidth=1;g.strokeRect(-cw/2+4,-ch/2+4,cw-8,ch-8);g.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,r=i%2?cw*.07:cw*.22;g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}g.closePath();g.fillStyle=col;g.fill();g.restore()}

/* ================= Scene base ================= */
class Scene{
  constructor(){this.T=0;this.bg=null;this.p={sx:0,sy:0,x:-999,y:-999}}
  init(w,h){this.w=w;this.h=h;this.T=0;this.build(w,h)}
  resize(w,h){this.init(w,h)}
  tick(dt,p){this.p=p;this.d=dt*ENV.spd;this.T+=this.d}
  blit(g,c,f){g.drawImage(c,-M-this.p.sx*f,-M-this.p.sy*f*.6,this.w+2*M,this.h+2*M)} // parallax blit
  dispose(){this.bg=null}
  click(){}
}

/* ================= Scene 1: Chinese temple ================= */
class Temple extends Scene{
  constructor(){super();this.acc='#ffcf6b';this.sub='ขอพรและเสี่ยงเซียมซี ณ ศาลเจ้าจีน'}
  build(w,h){
    const sc=h/800,cx=w/2,ay=h*.8,aw=Math.min(w*.72,640),by=h*.1,gold='#d9a73e',g=(this.bg=layer(w,h)).g;
    g.fillStyle=lg(g,0,0,0,h,[[0,'#1c0406'],[.35,'#5e0d12'],[.78,'#3a0a0c'],[1,'#120304']]);g.fillRect(-M,-M,w+2*M,h+2*M);
    // roof beams + brackets
    g.fillStyle='#1a0a06';g.fillRect(-M,-M,w+2*M,by+M);g.fillStyle='#3b1a0c';g.fillRect(-M,by-4,w+2*M,12);g.fillStyle=gold;g.fillRect(-M,by+8,w+2*M,2);
    for(let x=w*.04;x<w+20;x+=w*.09){g.fillStyle='#2a1209';g.strokeStyle=gold;g.lineWidth=1;g.beginPath();g.moveTo(x-16,by+10);g.lineTo(x+16,by+10);g.lineTo(x+8,by+30);g.lineTo(x-8,by+30);g.closePath();g.fill();g.stroke();g.beginPath();g.arc(x+w*.045,by+20,7,0,TAU*.8);g.stroke()}
    // latticed window
    const ww=w*.22,wy=h*.15,wh=h*.26,wx=cx-ww/2;
    g.fillStyle=lg(g,0,wy,0,wy+wh,[[0,'rgba(255,205,120,.55)'],[1,'rgba(255,150,70,.25)']]);g.fillRect(wx,wy,ww,wh);
    g.strokeStyle='#2a0f08';g.lineWidth=2;g.beginPath();for(let i=1;i<6;i++){g.moveTo(wx+ww*i/6,wy);g.lineTo(wx+ww*i/6,wy+wh)}for(let i=1;i<5;i++){g.moveTo(wx,wy+wh*i/5);g.lineTo(wx+ww,wy+wh*i/5)}g.stroke();g.lineWidth=6;g.strokeRect(wx,wy,ww,wh);
    // deity statue silhouette
    glow(g,'255,190,90',cx,h*.55,170*sc,.4);g.fillStyle='rgba(28,8,6,.9)';g.beginPath();g.arc(cx,h*.5,26*sc,0,TAU);g.fill();g.beginPath();g.moveTo(cx-80*sc,ay);g.lineTo(cx-40*sc,h*.54);g.lineTo(cx+40*sc,h*.54);g.lineTo(cx+80*sc,ay);g.fill();
    g.strokeStyle='rgba(217,167,62,.5)';g.lineWidth=1.5;g.beginPath();g.arc(cx,h*.5,26*sc,0,TAU);g.stroke();
    // floor with perspective tiles
    g.fillStyle=lg(g,0,ay,0,h,[[0,'#2a0d0a'],[1,'#0c0302']]);g.fillRect(-M,ay,w+2*M,h-ay+M);
    g.strokeStyle='rgba(0,0,0,.4)';g.lineWidth=1.5;g.beginPath();const vy=h*.5;for(let i=-9;i<=9;i++){const xb=cx+i*w*.12;g.moveTo(cx+(xb-cx)*(ay-vy)/(h-vy),ay);g.lineTo(xb,h+M)}for(let k=1;k<=6;k++){const y=ay+(h-ay)*(k/6)**2;g.moveTo(-M,y);g.lineTo(w+M,y)}g.stroke();
    // pillars (far = plain, near = couplets)
    [[w*.27,w*.035,0],[w*.73,w*.035,0],[w*.07,w*.07,1],[w*.93,w*.07,2]].forEach(([x,pw,c])=>{
      g.fillStyle=lg(g,x-pw/2,0,x+pw/2,0,[[0,'#220505'],[.4,c?'#8a1a1a':'#5a1010'],[1,'#2a0707']]);g.fillRect(x-pw/2,by+8,pw,ay-by-8);
      g.fillStyle=gold;g.fillRect(x-pw/2-3,by+8,pw+6,6);g.fillRect(x-pw/2-3,ay-14,pw+6,8);
      if(c){g.fillStyle='rgba(15,3,3,.9)';g.fillRect(x-pw*.3,h*.2,pw*.6,h*.46);g.fillStyle=gold;g.font=`${pw*.38}px "Noto Serif CJK SC","Songti SC",SimSun,serif`;g.textAlign='center';g.textBaseline='middle';[...(c==1?'福祿壽喜':'財源廣進')].forEach((ch,i)=>g.fillText(ch,x,h*.2+h*.46*(i+.5)/4))}});
    // altar
    const ty=ay-6,ax0=cx-aw/2;
    g.fillStyle=lg(g,0,ay,0,h,[[0,'#8a1414'],[1,'#3a0707']]);g.fillRect(ax0,ay,aw,h-ay+M);g.fillStyle=gold;g.fillRect(ax0,ay,aw,5);g.fillStyle='#2a1209';g.fillRect(ax0-8,ty-2,aw+16,10);
    g.strokeStyle=gold;g.lineWidth=2;for(let i=0;i<5;i++){const mx=ax0+aw*(i+.5)/5,my=ay+(h-ay)*.4;g.beginPath();g.arc(mx,my,aw*.04,0,TAU);g.stroke();g.beginPath();g.arc(mx,my,aw*.02,0,TAU);g.stroke()}
    // incense burner + sticks
    const bw=aw*.12,bh=aw*.07;
    g.fillStyle=lg(g,cx-bw/2,0,cx+bw/2,0,[[0,'#5a3a12'],[.5,'#c9953a'],[1,'#4a2e0e']]);g.beginPath();g.moveTo(cx-bw/2,ty-bh);g.lineTo(cx+bw/2,ty-bh);g.lineTo(cx+bw*.35,ty);g.lineTo(cx-bw*.35,ty);g.closePath();g.fill();
    g.fillRect(cx-bw*.66,ty-bh-4,bw*.18,10);g.fillRect(cx+bw*.48,ty-bh-4,bw*.18,10);g.fillStyle='#1b1008';g.fillRect(cx-bw/2,ty-bh-3,bw,6);
    this.tips=[-.25,0,.25].map((k,i)=>{const x=cx+k*bw*.9,y=ty-bh-aw*.11-i%2*8;g.strokeStyle='#7a3a1a';g.lineWidth=2;g.beginPath();g.moveTo(x-k*bw*.3,ty-bh);g.lineTo(x,y);g.stroke();return{x,y}});
    // fortune-stick cylinder
    const tx=cx+aw*.24,tw=aw*.07,th=aw*.12;
    for(let i=0;i<15;i++){const a=(i-7)*.05,x=tx+(i-7)*tw*.05;g.strokeStyle='#d9b36a';g.lineWidth=2.2;g.beginPath();g.moveTo(x,ty-th);g.lineTo(x+Math.sin(a)*aw*.16,ty-th-Math.cos(a)*aw*.12*(.8+rnd()*.3));g.stroke()}
    g.fillStyle=lg(g,tx-tw/2,0,tx+tw/2,0,[[0,'#6a4a1a'],[.5,'#c9953a'],[1,'#5a3a12']]);g.fillRect(tx-tw/2,ty-th,tw,th);g.fillStyle='#7a1010';g.fillRect(tx-tw/2,ty-th*.7,tw,4);g.fillRect(tx-tw/2,ty-th*.25,tw,4);
    // candles
    this.fl=[-.4,.4].map(k=>{const x=cx+k*aw,cw=aw*.035,ch=aw*.1;g.fillStyle=gold;g.fillRect(x-cw,ty-4,cw*2,4);g.fillStyle='#b01818';g.fillRect(x-cw/2,ty-ch,cw,ch);g.fillStyle='#e8c8a0';g.fillRect(x-1,ty-ch-5,2,5);return{x,y:ty-ch-aw*.012}});
    this.A={cx,ay,aw,sc};
    // dynamic pools
    this.lan=Array.from({length:Math.round(12*Math.max(ENV.q,.85))},()=>{const z=rnd();return{z,x:rand(.03,.97)*w,len:h*rand(.08,.3)*(.7+.5*z),r:(12+30*z)*Math.max(.7,sc*1.1),A:.03+.05*(1-z*.4),w:.8+rnd()*.5,ph:rnd()*TAU}}).sort((a,b)=>a.z-b.z);
    this.smoke=pl(50,()=>({l:0,m:1,i:0,ph:0}));this.emb=pl(70,()=>({l:0,m:1,x:0,y:0,vy:0,s:1,ph:0}));this.spk=Array.from({length:100},()=>({l:0,m:1,x:0,y:0,vx:0,vy:0}));
    this.smoke.forEach(s=>this.reSmoke(s,true));this.emb.forEach(e=>this.reEmb(e,true));this.heat=0;
  }
  reSmoke(s,init){s.m=rand(4,7);s.l=init?s.m*rnd():s.m;s.i=rnd()*this.tips.length|0;s.ph=rnd()*9}
  reEmb(e,init){e.m=rand(5,10);e.l=init?e.m*rnd():e.m;e.x=rand(0,this.w);e.y=init?rand(0,this.h):this.h*rand(.75,1.05);e.vy=rand(10,28);e.s=rand(1,2.4);e.ph=rnd()*9}
  burst(x,y,n){for(const s of this.spk){if(n<=0)break;if(s.l>0)continue;const a=rnd()*TAU,v=rand(60,320);s.x=x;s.y=y;s.vx=Math.cos(a)*v;s.vy=Math.sin(a)*v-80;s.m=s.l=rand(.7,1.5);n--}}
  click(p){this.burst(p.x,p.y,40);this.heat=1}
  update(dt,p){
    this.tick(dt,p);const d=this.d,T=this.T,A=this.A;
    const near=Math.hypot(p.x-A.cx,p.y-(A.ay-A.aw*.06))<A.aw*.55;this.heat+=((near?1:0)-this.heat)*Math.min(1,dt*4);
    for(const s of this.smoke)if((s.l-=d)<=0)this.reSmoke(s);
    for(const e of this.emb){e.l-=d;e.y-=e.vy*d*(1+this.heat);e.x+=(noise(T*.3+e.ph,e.y*.01)-.5)*50*d;if(e.l<=0||e.y<-10)this.reEmb(e)}
    for(const s of this.spk)if(s.l>0){s.l-=d;s.vy+=300*d;s.x+=s.vx*d;s.y+=s.vy*d;s.vx*=.985}
  }
  draw(g){
    const {w,h,T}=this,{cx,ay,aw,sc}=this.A,hb=1+.9*this.heat,px=this.p.sx,pu=.75+.25*Math.sin(T*.6);
    this.blit(g,this.bg,6);
    // golden light shafts from the window
    g.globalCompositeOperation='lighter';
    const wy=h*.41,ww=w*.22;
    for(let k=0;k<3;k++){const x1=cx-ww/2+ww*k/3;g.fillStyle=lg(g,0,wy,0,ay,[[0,`rgba(255,205,120,${.2*pu})`],[1,'rgba(255,150,60,0)']]);g.beginPath();g.moveTo(x1,wy);g.lineTo(x1+ww/3,wy);g.lineTo(x1+ww/3+w*.22,ay);g.lineTo(x1+w*.18,ay);g.fill()}
    glow(g,'255,200,110',cx,h*.28,ww*.9,.3*pu);
    g.save();g.translate(cx,ay+h*.07);g.scale(1,.28);glow(g,'255,80,40',0,0,aw*.75,.22*hb);g.restore();
    // swaying lanterns (far -> near)
    this.lan.forEach((l,i)=>{
      const r=l.r,a=l.A*Math.sin(T*l.w+l.ph),fl=.8+.2*noise(T*3+i*7,i),len=l.len+M;
      g.save();g.translate(l.x-px*(3+l.z*14),-M);g.rotate(a);g.globalCompositeOperation='source-over';
      g.strokeStyle='rgba(210,160,60,.8)';g.lineWidth=1+l.z*1.5;g.beginPath();g.moveTo(0,0);g.lineTo(0,len);g.stroke();g.translate(0,len+r*.9);
      g.globalCompositeOperation='lighter';glow(g,'255,70,40',0,0,r*(3+l.z),(.28+.3*l.z)*fl*hb*.8);g.globalCompositeOperation='source-over';
      g.fillStyle=rg(g,0,-r*.25,r*.1,0,0,r,[[0,'#ff7a45'],[.55,'#d3161a'],[1,'#6a0507']]);
      const bl=l.z>.8?3:1; // near lanterns: stacked soft ellipses fake depth-of-field blur
      for(let b=0;b<bl;b++){g.globalAlpha=bl>1?.4:1;g.beginPath();g.ellipse(0,0,r*(1+b*.07),r*.85*(1+b*.07),0,0,TAU);g.fill()}g.globalAlpha=1;
      g.strokeStyle='rgba(110,0,0,.55)';g.lineWidth=1;for(const k of[.45,.8]){g.beginPath();g.ellipse(0,0,r*k,r*.85,0,0,TAU);g.stroke()}
      g.fillStyle='#d9a73e';g.fillRect(-r*.4,-r*.85-5,r*.8,6);g.fillRect(-r*.4,r*.85-1,r*.8,6);g.fillRect(-1,r*.85+5,2,r*.5);g.fillStyle='#c01a1a';g.fillRect(-2.5,r*.85+r*.45,5,r*.3);
      g.restore()});
    // incense smoke (noise-driven)
    g.globalCompositeOperation='source-over';
    for(const s of this.smoke){const a=s.m-s.l,t=this.tips[s.i];glow(g,'205,190,175',t.x+(noise(a*.5+s.ph,T*.12)-.5)*(16+a*18),t.y-a*28*sc,(3+a*7)*sc+2,.14*(1-a/s.m)*Math.min(1,a*2.5))}
    // flames, incense tips, embers, sparks
    g.globalCompositeOperation='lighter';
    this.fl.forEach((f,i)=>flame(g,f.x,f.y,aw*.011*(1+.3*this.heat),(.78+.22*noise(T*8+i*9,2))*(.8+.2*hb),(noise(T*3+i*4,5)-.5)*1.4));
    for(const t of this.tips){glow(g,'255,70,30',t.x,t.y,7*sc*hb,.9);glow(g,'255,60,20',t.x,t.y,26*sc*hb,.28)}
    for(const e of this.emb)glow(g,'255,175,80',e.x-px*8,e.y,e.s*3*(1+.5*this.heat),Math.sin(Math.PI*clamp(e.l/e.m,0,1))*(.45+.45*Math.sin(T*4+e.ph))*(.55+.3*this.heat));
    for(const s of this.spk)if(s.l>0)glow(g,'255,215,120',s.x,s.y,6,s.l/s.m);
  }
  dispose(){super.dispose();this.lan=this.smoke=this.emb=this.spk=null}
}

/* ================= Scene 2A: Witch's chamber ================= */
class Witch extends Scene{
  constructor(){super();this.acc='#c58cff';this.sub='หมอดูแม่มด · ลูกแก้ววิเศษแห่งห้องลับ'}
  build(w,h){
    const sc=h/800,cx=w/2,ty=h*.78,tw=Math.min(w*.64,580),g=(this.bg=layer(w,h)).g,gold='#d9a73e',rd=clamp(Math.min(w*.2,h*.14),38,130);
    this.B={cx,cy:ty-rd*1.3,rd};
    g.fillStyle=lg(g,0,0,0,h,[[0,'#0b0516'],[.6,'#241040'],[1,'#120826']]);g.fillRect(-M,-M,w+2*M,h+2*M);
    g.strokeStyle='rgba(255,255,255,.045)';g.lineWidth=1;g.beginPath();const bh=34*sc+10;for(let y=0,r=0;y<h+M;y+=bh,r++){g.moveTo(-M,y);g.lineTo(w+M,y);for(let x=(r%2)*bh*1.1-M;x<w+M;x+=bh*2.2){g.moveTo(x,y);g.lineTo(x,y+bh)}}g.stroke();
    // arched window with moon

    g.beginPath();for(let k=0;k<=N;k++){const a=k/N*TAU;this.pt(Math.cos(a)*r.r,Math.sin(a)*r.r,ca,sa,cb,sb);k?g.lineTo(cx+o.x*R,cy+o.y*R):g.moveTo(cx+o.x*R,cy+o.y*R)}
    g.strokeStyle='rgba(255,190,80,.16)';g.lineWidth=6;g.stroke();g.strokeStyle='#f2cf7a';g.lineWidth=1.6;g.stroke();
    if(r.t){g.beginPath();for(let k=0;k<48;k++){const a=k/48*TAU,c=Math.cos(a),s=Math.sin(a);this.pt(c*r.r,s*r.r,ca,sa,cb,sb);const x1=cx+o.x*R,y1=cy+o.y*R;this.pt(c*r.r*.93,s*r.r*.93,ca,sa,cb,sb);g.moveTo(x1,y1);g.lineTo(cx+o.x*R,cy+o.y*R)}g.strokeStyle='rgba(255,225,150,.8)';g.lineWidth=1;g.stroke()}
    const a=T*r.wn+i*1.9;this.pt(Math.cos(a)*r.r,Math.sin(a)*r.r,ca,sa,cb,sb);glow(g,'255,220,130',cx+o.x*R,cy+o.y*R,10+5*o.z,.9);
  }
  cards(g,front){
    const {cx,cy,rd}=this.W,T=this.T;
    for(let i=0;i<4;i++){const a=T*.18+i*TAU/4,s=Math.sin(a);if((s>0)!==front)continue;const k=.75+.25*s,x=cx+Math.cos(a)*rd*1.8,y=cy+s*rd*.5+rd*.1;
      g.globalCompositeOperation='lighter';glow(g,'110,160,255',x,y,rd*.6*k,.35);g.globalCompositeOperation='source-over';g.globalAlpha=front?1:.65;card(g,x,y,rd*.42*k,rd*.68*k,Math.cos(a)*.25,'#8ec2ff');g.globalAlpha=1}
  }
  draw(g){
    const {T}=this,{cx,cy,rd,sc}=this.W,p=this.p,ox=-p.sx*5,oy=-p.sy*3;
    this.blit(g,this.bg,5);
    g.globalCompositeOperation='lighter';
    g.strokeStyle='rgba(150,190,255,.14)';g.lineWidth=1;g.beginPath();for(let i=0;i<this.ln.length;i+=2){const a=this.st[this.ln[i]],b=this.st[this.ln[i+1]];g.moveTo(a.x+ox,a.y+oy);g.lineTo(b.x+ox,b.y+oy)}g.stroke();
    for(const s of this.st){const tw=.5+.5*Math.sin(T*2+s.ph),sx=s.x+ox,sy=s.y+oy,dx=p.x-sx,dy=p.y-sy,dd=dx*dx+dy*dy;glow(g,'190,215,255',sx,sy,s.s*3.5*(.7+.3*tw),.35+.6*tw);
      if(dd<19600){g.strokeStyle=`rgba(150,210,255,${(1-Math.sqrt(dd)/140)*.5})`;g.beginPath();g.moveTo(sx,sy);g.lineTo(p.x,p.y);g.stroke()}}
    for(const s of this.sh)if(s.l>0){const k=s.l/s.m;g.strokeStyle=lg(g,s.x-s.vx*.14,s.y-s.vy*.14,s.x,s.y,[[0,'rgba(180,210,255,0)'],[1,`rgba(255,255,255,${Math.min(1,k*1.5)})`]]);g.lineWidth=2;g.beginPath();g.moveTo(s.x-s.vx*.14,s.y-s.vy*.14);g.lineTo(s.x,s.y);g.stroke();glow(g,'220,235,255',s.x,s.y,8,k)}
    // lantern + orb light
    this.lt.forEach((l,i)=>glow(g,'255,190,90',l.x,l.y,90*sc+20,.45*(.8+.2*noise(T*6+i*9,4))));
    glow(g,'90,170,255',this.orb.x,this.orb.y,this.orb.r*3,.5+.2*Math.sin(T*2));
    this.cards(g,false);
    // rotating astrolabe
    g.globalCompositeOperation='lighter';glow(g,'120,160,255',cx,cy,rd*1.7,.22);
    this.rg.forEach((r,i)=>this.ring(g,cx,cy,rd,r,T,i));
    glow(g,'120,180,255',cx,cy,rd*.5,.6);glow(g,'255,220,150',cx,cy,rd*.18,.9);
    this.cards(g,true);
    g.globalCompositeOperation='source-over';
    const ob=this.orb;g.fillStyle=rg(g,ob.x-ob.r*.3,ob.y-ob.r*.3,ob.r*.1,ob.x,ob.y,ob.r,[[0,'#bfe4ff'],[.6,'#3a7ad8'],[1,'#0e2a6a']]);g.beginPath();g.arc(ob.x,ob.y,ob.r,0,TAU);g.fill();
  }
  dispose(){super.dispose();this.st=this.ln=this.sh=this.rg=null}
}

/* ================= Manager: loop, crossfade, UI ================= */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),tmp=document.createElement('canvas'),tg=tmp.getContext('2d');
const card_=document.getElementById('card'),bar=document.getElementById('bar'),P={x:-999,y:-999,tx:0,ty:0,sx:0,sy:0};
const THEMES=[{t:'เสี่ยงเซียมซี',sc:[new Temple()]},{t:'ไพ่ยิปซี',sc:[new Witch(),new Wizard()]}]; // register new themes here
let cur=null,prev=null,fade=1,ti=0,vi=0,vg=null,last=0;
const gt=document.createElement('canvas');gt.width=gt.height=128;
{const x=gt.getContext('2d'),im=x.createImageData(128,128);for(let i=0;i<im.data.length;i+=4){im.data[i]=im.data[i+1]=im.data[i+2]=rnd()*255;im.data[i+3]=255}x.putImageData(im,0,0)}
const grain=ctx.createPattern(gt,'repeat');

function resize(){
  const w=innerWidth,h=innerHeight,d=ENV.dpr=Math.min(devicePixelRatio||1,2);
  ENV.w=w;ENV.h=h;ENV.mobile=Math.min(w,h)<600||w*h<500000;ENV.q=(ENV.mobile?.55:1)*(ENV.reduced?.4:1);ENV.spd=ENV.reduced?.45:1;
  for(const c of[cv,tmp]){c.width=w*d|0;c.height=h*d|0}
  vg=document.createElement('canvas');vg.width=w;vg.height=h;const v=vg.getContext('2d');v.fillStyle=rg(v,w/2,h/2,Math.min(w,h)*.25,w/2,h/2,Math.hypot(w,h)*.55,[[0,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,.7)']]);v.fillRect(0,0,w,h);
  if(cur)cur.resize(w,h);if(prev)prev.resize(w,h);
}
function go(i,v){
  const th=THEMES[i];if(v==null)v=th.sc.length>1?Math.random()*th.sc.length|0:0;
  const s=th.sc[v];if(s===cur)return;
  if(prev)prev.dispose();
  prev=cur;cur=s;fade=prev?0:1;s.init(ENV.w,ENV.h);ti=i;vi=v;ui();
}
function swapVar(d){const th=THEMES[ti];if(th.sc.length>1)go(ti,(vi+d+th.sc.length)%th.sc.length)}
function btn(t,f){const b=document.createElement('button');b.textContent=t;b.onclick=f;bar.append(b);return b}
THEMES.forEach((th,i)=>{th.b=btn(th.t,()=>{if(i!==ti)go(i)})});
btn('🎲 สุ่มธีม',()=>{let i;do i=Math.random()*THEMES.length|0;while(i===ti&&THEMES.length>1);go(i)});
const vb=btn('🔮 สลับ แม่มด / พ่อมด',()=>swapVar(1));
function ui(){
  THEMES.forEach((t,i)=>t.b.classList.toggle('on',i===ti));vb.style.display=THEMES[ti].sc.length>1?'':'none';
  card_.querySelector('h1').textContent=THEMES[ti].t;card_.querySelector('p').textContent=cur.sub;document.documentElement.style.setProperty('--acc',cur.acc);
}
function paint(g,s){g.save();g.globalAlpha=1;g.globalCompositeOperation='source-over';s.draw(g);g.restore()}
function frame(t){
  requestAnimationFrame(frame);
  if(document.hidden){last=0;return} // pause when tab hidden
  const dt=Math.min(.05,last?(t-last)/1000:.016),d=ENV.dpr,w=ENV.w,h=ENV.h;last=t;
  const k=Math.min(1,dt*3);P.sx+=(P.tx-P.sx)*k;P.sy+=(P.ty-P.sy)*k;
  ctx.setTransform(d,0,0,d,0,0);
  if(prev){fade+=dt/.8;if(fade>=1){prev.dispose();prev=null;fade=1}}
  if(prev){ // crossfade: outgoing scene directly, incoming via temp canvas
    prev.update(dt,P);paint(ctx,prev);tg.setTransform(d,0,0,d,0,0);tg.clearRect(0,0,w,h);cur.update(dt,P);paint(tg,cur);
    ctx.globalAlpha=fade*fade*(3-2*fade);ctx.drawImage(tmp,0,0,w,h);ctx.globalAlpha=1;
  }else{cur.update(dt,P);paint(ctx,cur)}
  ctx.drawImage(vg,0,0,w,h);
  ctx.save();ctx.globalAlpha=.045;ctx.fillStyle=grain;ctx.translate(Math.random()*128|0,Math.random()*128|0);ctx.fillRect(-128,-128,w+128,h+128);ctx.restore();
}
const setP=e=>{P.x=e.clientX;P.y=e.clientY;P.tx=P.x/ENV.w*2-1;P.ty=P.y/ENV.h*2-1};
addEventListener('pointermove',setP);
addEventListener('pointerdown',e=>{if(e.target.closest('#bar'))return;setP(e);cur&&cur.click(P)});
addEventListener('keydown',e=>{const n=THEMES.length;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){go((ti+(e.key==='ArrowRight'?1:-1)+n)%n);e.preventDefault()}else if(e.key==='ArrowUp'||e.key==='ArrowDown'){swapVar(e.key==='ArrowUp'?-1:1);e.preventDefault()}});
addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{last=0});
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',e=>{ENV.reduced=e.matches;resize()});
resize();go(0);requestAnimationFrame(frame);
</script>
</body></html>
