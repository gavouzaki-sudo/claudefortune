<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ฉากหลังดูดวง</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Sarabun,"Noto Sans Thai",Tahoma,sans-serif}
canvas{position:fixed;inset:0;z-index:0;width:100%;height:100%;display:block;touch-action:none}
#card{position:fixed;z-index:2;left:50%;top:44%;transform:translate(-50%,-50%);padding:26px 46px;text-align:center;border-radius:24px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 10px 50px rgba(0,0,0,.45);pointer-events:none;max-width:84vw}
#card h1{margin:0;font-size:clamp(26px,5.5vw,50px);font-weight:700;text-shadow:0 2px 14px rgba(0,0,0,.6)}
#card p{margin:8px 0 0;opacity:.85;font-size:clamp(13px,2.2vw,17px)}
#bar{position:fixed;z-index:3;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;
  padding:14px 10px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.55))}
button{font:inherit;font-size:15px;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);
  border-radius:999px;padding:8px 16px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .2s,border-color .2s}
button:hover{background:rgba(255,255,255,.22)}
button.on{background:rgba(255,255,255,.3);border-color:#fff}
#tog{position:fixed;z-index:3;top:calc(14px + env(safe-area-inset-top,0px));right:14px;display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="card"><h1 id="ttl"></h1><p id="sub"></p></div>
<button id="tog">🔮 สลับ แม่มด / พ่อมด</button>
<div id="bar"></div>
<script>
(()=>{
'use strict';
/* ====================== helpers ====================== */
const M=Math,TAU=M.PI*2,rnd=M.random,PAD=70;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>v<a?a:v>b?b:v;
let DPR=1,LD=1; // DPR for main canvas, LD (<=1.5) for pre-rendered layers (saves memory)
// seeded random (mulberry32)
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=M.imul(a^a>>>15,1|a);t=t+M.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// tileable value noise
const perm=(()=>{const r=mulberry(7),p=new Uint8Array(256);for(let i=0;i<256;i++)p[i]=r()*256;return p})();
const HS=(a,b,P)=>perm[(perm[((a%P)+P)%P]+((b%P)+P)%P)&255]/255;
function tn(x,y,P){const xi=M.floor(x),yi=M.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return lerp(lerp(HS(xi,yi,P),HS(xi+1,yi,P),u),lerp(HS(xi,yi+1,P),HS(xi+1,yi+1,P),u),v)}
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=M.ceil(w);c.height=M.ceil(h);return c};
// pre-rendered layer with PAD margin so parallax never reveals edges
function layer(w,h,fn){const c=mk((w+2*PAD)*LD,(h+2*PAD)*LD),g=c.getContext('2d');g.scale(LD,LD);g.translate(PAD,PAD);fn(g);return c}
function putL(g,L,ox,oy){g.drawImage(L,-PAD+ox,-PAD+oy,L.width/LD,L.height/LD)}
const dens=(w,h,n)=>M.max(8,M.round(n*clamp(w*h/2073600,.3,1.1)*(reduce?.5:1)));
// cached radial glow sprites (k = "r,g,b")
const GS={};
function spr(k){let c=GS[k];if(!c){c=mk(64,64);const g=c.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);
  r.addColorStop(0,'rgba('+k+',1)');r.addColorStop(.25,'rgba('+k+',.45)');r.addColorStop(1,'rgba('+k+',0)');g.fillStyle=r;g.fillRect(0,0,64,64);GS[k]=c}return c}
function glow(g,x,y,r,k,a){g.globalAlpha=a;g.drawImage(spr(k),x-r,y-r,r*2,r*2)}
// procedural fog tile: horizontally tileable, soft vertical fade
const FT={};
function fog(rgb,seed){const key=rgb+'|'+seed;if(FT[key])return FT[key];const S=160,c=mk(S,S),g=c.getContext('2d'),id=g.createImageData(S,S),d=id.data,p=rgb.split(',');
  for(let y=0;y<S;y++){const vf=M.pow(M.sin(M.PI*y/S),.8);for(let x=0;x<S;x++){let a=0,amp=.55,f=4;
    for(let o=0;o<4;o++){a+=amp*tn(x/S*f+seed*f,y/S*f+seed*f,f);amp*=.5;f*=2}
    const i=(y*S+x)*4;d[i]=+p[0];d[i+1]=+p[1];d[i+2]=+p[2];d[i+3]=clamp((a-.28)*2.4,0,1)*vf*255}}
  g.putImageData(id,0,0);return FT[key]=c}
function drawFog(g,tile,w,yc,hh,off,a){const tw=hh*2.4,st=-(((off%tw)+tw)%tw);g.globalAlpha=a;for(let x=st;x<w;x+=tw)g.drawImage(tile,x,yc-hh/2,tw+1,hh)}
function star(g,r1,r2,n){for(let i=0;i<n*2;i++){const a=i*M.PI/n-M.PI/2,r=i&1?r2:r1;i?g.lineTo(M.cos(a)*r,M.sin(a)*r):g.moveTo(M.cos(a)*r,M.sin(a)*r)}g.closePath()}
const ORD=[-3,3,-2,2,-1,1,0];
function lotus(g,x,y,sz){for(const k of ORD){g.save();g.translate(x,y);g.rotate(k*.4);g.beginPath();g.ellipse(0,-sz*.55,sz*.27,sz*.6,0,0,TAU);g.fill();g.stroke();g.restore()}}
function heart(g,x,y,s){g.beginPath();g.moveTo(x,y+s*.35);g.bezierCurveTo(x-s*.9,y-s*.2,x-s*.45,y-s*.85,x,y-s*.35);g.bezierCurveTo(x+s*.45,y-s*.85,x+s*.9,y-s*.2,x,y+s*.35);g.fill()}
// shared god-ray sprite
let RAY=null;
function raySpr(){if(RAY)return RAY;RAY=mk(64,256);const g=RAY.getContext('2d'),L=g.createLinearGradient(0,0,0,256);
  L.addColorStop(0,'rgba(255,240,190,1)');L.addColorStop(1,'rgba(255,230,160,0)');g.fillStyle=L;g.beginPath();g.moveTo(26,0);g.lineTo(38,0);g.lineTo(64,256);g.lineTo(0,256);g.fill();
  g.globalCompositeOperation='destination-in';const X=g.createLinearGradient(0,0,64,0);X.addColorStop(0,'rgba(0,0,0,0)');X.addColorStop(.5,'rgba(0,0,0,1)');X.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=X;g.fillRect(0,0,64,256);return RAY}
// ember palette: red-orange -> gold -> white-gold
const EMB=[];for(let i=0;i<16;i++){const f=i/15,A=[255,70,20],B=[255,160,50],C=[255,225,130],D=[255,248,215];let a,b,k;
  if(f<.4){a=A;b=B;k=f/.4}else if(f<.75){a=B;b=C;k=(f-.4)/.35}else{a=C;b=D;k=(f-.75)/.25}
  EMB.push(M.round(lerp(a[0],b[0],k))+','+M.round(lerp(a[1],b[1],k))+','+M.round(lerp(a[2],b[2],k)))}
// shared drawing helpers for static silhouettes
function tree(g,x,y,len,ang,wd,d,r){if(d<=0||len<4)return;const x2=x+M.cos(ang)*len,y2=y+M.sin(ang)*len;g.lineWidth=wd;g.beginPath();g.moveTo(x,y);g.lineTo(x2,y2);g.stroke();
  const n=r()<.3?3:2;for(let i=0;i<n;i++)tree(g,x2,y2,len*(.68+r()*.12),ang+(r()-.5)*1.3,wd*.7,d-1,r)}
function gate(g,x,y,wd,ht,s){g.lineWidth=2.5*s;const st=12*s;for(let bx=x;bx<=x+wd;bx+=st){g.beginPath();g.moveTo(bx,y);g.lineTo(bx,y-ht);g.stroke();
  g.beginPath();g.moveTo(bx-3*s,y-ht);g.lineTo(bx,y-ht-9*s);g.lineTo(bx+3*s,y-ht);g.fill()}
  g.beginPath();g.moveTo(x,y-ht*.3);g.lineTo(x+wd,y-ht*.3);g.moveTo(x,y-ht*.75);g.lineTo(x+wd,y-ht*.75);g.stroke()}
function cross(g,x,y,sz){g.fillRect(x-sz*.07,y-sz,sz*.14,sz);g.fillRect(x-sz*.28,y-sz*.8,sz*.56,sz*.13)}
function angel(g,x,y,sz){g.fillRect(x-sz*.2,y-sz*.25,sz*.4,sz*.25);g.beginPath();g.moveTo(x-sz*.16,y-sz*.25);g.lineTo(x-sz*.08,y-sz*.9);g.lineTo(x+sz*.08,y-sz*.9);g.lineTo(x+sz*.16,y-sz*.25);g.fill();
  g.beginPath();g.arc(x,y-sz,sz*.1,0,TAU);g.fill();
  for(const d of [-1,1]){g.beginPath();g.moveTo(x+d*sz*.05,y-sz*.85);g.quadraticCurveTo(x+d*sz*.6,y-sz,x+d*sz*.5,y-sz*.45);g.quadraticCurveTo(x+d*sz*.25,y-sz*.7,x+d*sz*.05,y-sz*.55);g.fill()}}
function tomb(g,x,y,wd,ht,tl,r,s,num){g.save();g.translate(x,y);g.rotate(tl);const L=g.createLinearGradient(-wd/2,0,wd/2,0);L.addColorStop(0,'#26383a');L.addColorStop(1,'#101c1d');
  g.fillStyle=L;g.strokeStyle='#3a5250';g.lineWidth=1.5;g.beginPath();g.moveTo(-wd/2,0);g.lineTo(-wd/2,-ht+wd/2);g.arc(0,-ht+wd/2,wd/2,M.PI,0);g.lineTo(wd/2,0);g.closePath();g.fill();g.stroke();
  g.strokeStyle='#04090a';g.lineWidth=1.3;g.beginPath();let cx=(r()-.5)*wd*.4,cy=-ht*.95;g.moveTo(cx,cy);for(let i=0;i<5;i++){cx+=(r()-.5)*wd*.25;cy+=ht*.14;g.lineTo(cx,cy)}g.stroke();
  g.fillStyle='rgba(80,130,60,.55)';for(let i=0;i<6;i++){g.beginPath();g.ellipse((r()-.5)*wd,-r()*ht*.25-2,wd*(.08+r()*.12),5*s,0,0,TAU);g.fill()}
  g.fillStyle='#07100f';g.font='bold '+((wd*.36)|0)+'px Sarabun,Tahoma,serif';g.textAlign='center';g.fillText(num,0,-ht*.5+wd*.12);g.restore()}
function roof(g,cx,y,wd,ht){g.beginPath();g.moveTo(cx-wd/2-10,y-ht*.35);g.quadraticCurveTo(cx-wd/2+4,y+2,cx-wd*.3,y-ht*.1);g.lineTo(cx-wd*.12,y-ht);g.lineTo(cx+wd*.12,y-ht);
  g.lineTo(cx+wd*.3,y-ht*.1);g.quadraticCurveTo(cx+wd/2-4,y+2,cx+wd/2+10,y-ht*.35);g.lineTo(cx+wd/2-2,y+ht*.12);g.lineTo(cx-wd/2+2,y+ht*.12);g.closePath();g.fill();g.stroke()}

/* ====================== base scene ====================== */
class Scene{
  constructor(){this.w=0;this.h=0;this.s=1;this.t=0;this.mx=0;this.my=0;this.p={x:0,y:0,sx:0,sy:0,act:false}}
  init(w,h){this.t=0;this.resize(w,h)}
  resize(w,h){this.w=w;this.h=h;this.s=clamp(M.min(w,h*1.5)/900,.55,1.5);this.build()}
  build(){}
  update(dt,p){this.t+=dt;this.p=p;const k=reduce?.35:1;this.mx=p.nx*k;this.my=p.ny*k}
  draw(g){}
  dispose(){for(const k in this)if(this[k] instanceof HTMLCanvasElement)this[k]=null} // free big offscreen layers
}

/* ====================== 1) ดวงชะตา : Cosmic ====================== */
class Cosmic extends Scene{
  constructor(){super();this.C={stars:260,shoot:3,rings:4,rot:.04};this.pt=new Float32Array(24)}
  build(){
    const {w,h,s,C}=this,r=mulberry(11);
    this.bg=layer(w,h,g=>{const L=g.createLinearGradient(0,-PAD,0,h+PAD);L.addColorStop(0,'#04041a');L.addColorStop(.55,'#150c36');L.addColorStop(1,'#34154a');
      g.fillStyle=L;g.fillRect(-PAD,-PAD,w+2*PAD,h+2*PAD);g.globalCompositeOperation='lighter';const nb=['110,60,220','60,100,230','220,70,160','90,50,170'];
      for(let i=0;i<10;i++)glow(g,r()*w,r()*h,(.18+r()*.3)*M.max(w,h),nb[i&3],.12+r()*.12)});
    this.st=[];for(let i=0,n=dens(w,h,C.stars);i<n;i++){const z=r()<.6?0:r()<.7?1:2;this.st.push({x:r()*(w+120)-60,y:r()*(h+120)-60,z,r:.5+z*.5+r()*.4,ph:r()*TAU,sp:1+r()*2.5,c:r()<.3?'#ffdcaa':'#cfe0ff'})}
    this.sh=[];for(let i=0;i<C.shoot;i++)this.sh.push({on:false,x:0,y:0,vx:0,vy:0,l:0});
    this.rg=[];for(let i=0;i<C.rings;i++)this.rg.push({on:false,x:0,y:0,r:0,a:0});
  }
  spawn(x,y){for(const q of this.sh)if(!q.on){const v=(520+rnd()*400)*this.s;q.on=true;q.x=x;q.y=y;q.vx=v*.88;q.vy=v*.42;q.l=0;return}}
  update(dt,p){super.update(dt,p);const {w,h,s}=this;
    if(rnd()<dt*.3)this.spawn(rnd()*w*.7,rnd()*h*.35);
    if(p.cl){this.spawn(p.x-120*s,p.y-60*s);for(const q of this.rg)if(!q.on){q.on=true;q.x=p.x;q.y=p.y;q.r=0;q.a=1;break}}
    for(const q of this.sh)if(q.on){q.x+=q.vx*dt;q.y+=q.vy*dt;q.l+=dt;if(q.l>1.3||q.x>w+100)q.on=false}
    for(const q of this.rg)if(q.on){q.r+=dt*280*s;q.a-=dt*.9;if(q.a<=0)q.on=false}}
  draw(g){
    const {w,h,s,t,mx,my,p,C,pt}=this;g.globalAlpha=1;g.globalCompositeOperation='source-over';putL(g,this.bg,mx*6,my*6);
    for(const q of this.st){const x=q.x+mx*(4+q.z*10),y=q.y+my*(3+q.z*7),tw=.55+.45*M.sin(t*q.sp+q.ph),d=M.hypot(x-p.x,y-p.y),b=d<130*s?1-d/(130*s):0,r=q.r*(1+b*1.5);
      g.globalAlpha=clamp(tw*.9+b,0,1);g.fillStyle=q.c;g.fillRect(x-r,y-r,r*2,r*2)}
    // zodiac wheel
    const cx=w/2+mx*14,cy=h*.46+my*8,R=M.min(w*.46,h*.4),rot=t*C.rot;g.globalCompositeOperation='lighter';
    glow(g,cx,cy,R*1.5,'150,100,255',.22);g.strokeStyle='#ffd69a';g.lineWidth=1.2;g.globalAlpha=.45;
    for(const q of [1,.9,.64,.3]){g.beginPath();g.arc(cx,cy,R*q,0,TAU);g.stroke()}
    g.globalAlpha=.4;g.beginPath();for(let i=0;i<72;i++){const a=rot+i*TAU/72,l=i%6?R*.02:R*.055;g.moveTo(cx+M.cos(a)*R*.9,cy+M.sin(a)*R*.9);g.lineTo(cx+M.cos(a)*(R*.9-l),cy+M.sin(a)*(R*.9-l))}g.stroke();
    for(let i=0;i<12;i++){const a=-rot*1.5+i*TAU/12;pt[i*2]=cx+M.cos(a)*R*.77;pt[i*2+1]=cy+M.sin(a)*R*.77}
    g.globalAlpha=.22;g.beginPath();for(let i=0;i<12;i++){const j=(i+5)%12;g.moveTo(pt[i*2],pt[i*2+1]);g.lineTo(pt[j*2],pt[j*2+1])}g.stroke();
    for(let i=0;i<12;i++)glow(g,pt[i*2],pt[i*2+1],(16+5*M.sin(t*2+i))*s,'255,220,160',.85);
    for(const q of this.rg)if(q.on){g.globalAlpha=q.a*.6;g.lineWidth=2;g.beginPath();g.arc(q.x,q.y,q.r,0,TAU);g.stroke()}
    for(const q of this.sh)if(q.on){const a=1-q.l/1.3;g.strokeStyle='#fff';for(let k=0;k<6;k++){g.globalAlpha=a*(1-k/6);g.lineWidth=2.4*(1-k/6);g.beginPath();
      g.moveTo(q.x-q.vx*.02*k,q.y-q.vy*.02*k);g.lineTo(q.x-q.vx*.02*(k+1),q.y-q.vy*.02*(k+1));g.stroke()}glow(g,q.x,q.y,14*s,'200,220,255',a)}
  }
}

/* ====================== 2) ไพ่ทาโรต์ : Tarot (v=0 witch, v=1 wizard) ====================== */
class Tarot extends Scene{
  constructor(v){super();this.v=v;this.C={cards:6,motes:70,bubbles:20,cw:74,ch:124,orbit:.1}}
  build(){
    const {w,h,s,v,C}=this,r=mulberry(21+v);
    this.cd=(v?[[.07,.52],[.93,.52],[.2,.86],[.8,.86]]:[[.12,.86],[.3,.87],[.55,.86]]).map(a=>({x:a[0]*w,y:a[1]*h}));
    this.cx=w*.84;this.cy=h*.8;
    this.bg=layer(w,h,g=>{
      const L=g.createLinearGradient(0,-PAD,0,h+PAD);
      if(v){L.addColorStop(0,'#050a22');L.addColorStop(.5,'#0d1b48');L.addColorStop(1,'#04060f')}else{L.addColorStop(0,'#0f0818');L.addColorStop(.5,'#2b1248');L.addColorStop(1,'#09040f')}
      g.fillStyle=L;g.fillRect(-PAD,-PAD,w+2*PAD,h+2*PAD);
      // arched window with stars / moon
      const wx=v?w*.5:w*.82,ww=v?w*.24:w*.16,wy=h*(v?.06:.1),wh=h*(v?.5:.38);
      g.beginPath();g.moveTo(wx-ww/2,wy+wh);g.lineTo(wx-ww/2,wy+ww/2);g.arc(wx,wy+ww/2,ww/2,M.PI,0);g.lineTo(wx+ww/2,wy+wh);g.closePath();
      const S=g.createLinearGradient(0,wy,0,wy+wh);S.addColorStop(0,v?'#1c3a8a':'#3b1d6e');S.addColorStop(1,v?'#0a1440':'#150a30');g.fillStyle=S;g.fill();
      g.save();g.clip();g.fillStyle='#fff';for(let i=0;i<40;i++){g.globalAlpha=.3+r()*.7;g.fillRect(wx-ww/2+r()*ww,wy+r()*wh,1.5,1.5)}
      g.globalCompositeOperation='lighter';
      if(!v){glow(g,wx,wy+wh*.35,ww*.9,'255,240,200',.5);g.globalCompositeOperation='source-over';g.globalAlpha=1;g.fillStyle='#f5ecd0';g.beginPath();g.arc(wx,wy+wh*.35,ww*.2,0,TAU);g.fill()}
      else glow(g,wx,wy+wh*.3,ww*.7,'120,160,255',.5);
      g.restore();g.globalAlpha=1;g.lineWidth=6*s;g.strokeStyle='#05030a';g.stroke();g.lineWidth=4*s;g.beginPath();g.moveTo(wx,wy);g.lineTo(wx,wy+wh);g.moveTo(wx-ww/2,wy+wh*.5);g.lineTo(wx+ww/2,wy+wh*.5);g.stroke();
      g.fillStyle='#05030a';
      if(v){ // bookshelves + floor
        const cols=['#2a2f6b','#4a2a5e','#1d4a5e','#5b3a1d'];
        for(const sd of [0,1]){const x0=sd?w*.84:-PAD,ww2=sd?w*.16+PAD:w*.16+PAD;g.fillStyle='#060a1a';g.fillRect(x0,h*.15,ww2,h);
          for(let y=h*.2;y<h*.8;y+=h*.13){g.fillStyle='#02040c';g.fillRect(x0,y+h*.1,ww2,5*s);for(let x=x0+4;x<x0+ww2-8;){const bw=(6+r()*7)*s;g.fillStyle=cols[(r()*4)|0];g.globalAlpha=.75;g.fillRect(x,y+h*.1-(26+r()*14)*s,bw,(26+r()*14)*s);x+=bw+1}g.globalAlpha=1}}
        const F=g.createLinearGradient(0,h*.84,0,h);F.addColorStop(0,'#0b1236');F.addColorStop(1,'#03050f');g.fillStyle=F;g.fillRect(-PAD,h*.84,w+2*PAD,h);
      }else{ // shelf, jars, hat, table
        g.fillStyle='#07030c';g.fillRect(w*.03,h*.3,w*.3,8*s);for(let i=0;i<6;i++){const jw=(14+r()*10)*s,jh=(24+r()*22)*s;g.fillRect(w*.04+i*w*.045,h*.3-jh,jw,jh)}
        g.beginPath();g.moveTo(w*.24,h*.3);g.lineTo(w*.27,h*.3-70*s);g.lineTo(w*.3,h*.3);g.fill();g.beginPath();g.ellipse(w*.27,h*.3,38*s,7*s,0,0,TAU);g.fill();
        g.fillRect(-PAD,h*.84,w+2*PAD,h);g.fillStyle='#3a1d5c';g.fillRect(-PAD,h*.84,w+2*PAD,2);
        g.fillStyle='#0a0610';g.beginPath();g.ellipse(this.cx,this.cy+28*s,60*s,46*s,0,0,TAU);g.fill();g.fillStyle='#1b0f28';g.beginPath();g.ellipse(this.cx,this.cy,64*s,15*s,0,0,TAU);g.fill();
        g.fillStyle='#1f5a2c';g.beginPath();g.ellipse(this.cx,this.cy,52*s,10*s,0,0,TAU);g.fill()}
      for(const c of this.cd){g.fillStyle='#d8cdb0';g.fillRect(c.x-4*s,c.y-18*s,8*s,18*s)} // candle bodies
    });

      g.fillStyle=L;g.beginPath();g.arc(64,64,60,0,TAU);g.fill();g.fillStyle='rgba(110,140,130,.22)';for(let i=0;i<7;i++){g.beginPath();g.ellipse(30+r()*70,30+r()*70,5+r()*9,4+r()*7,0,0,TAU);g.fill()}}
    this.far=layer(w,h,g=>{g.fillStyle=g.strokeStyle='#0a191c';g.lineCap='round';g.beginPath();g.moveTo(-PAD,h+PAD);

      gate(g,-PAD,gy-8*s,w+2*PAD,64*s,s);for(const f of [.07,.3,.66,.92])tree(g,f*w,gy-14*s,(58+r()*26)*s,-M.PI/2+(r()-.5)*.4,7*s,7,r)});
    this.mid=layer(w,h,g=>{g.fillStyle=g.strokeStyle='#061015';const y=gy+10*s;g.fillRect(-PAD,y,w+2*PAD,h+PAD);
      for(let x=w*.03;x<w;){const k=r();
        if(k<.35){const wd=(70+r()*40)*s,ht=(50+r()*20)*s;g.fillRect(x,y-ht,wd,ht);g.beginPath();g.moveTo(x-6*s,y-ht);g.lineTo(x+wd/2,y-ht-26*s);g.lineTo(x+wd+6*s,y-ht);g.fill();
          this.perch.push({x:x+wd/2,y:y-ht-26*s});g.fillStyle='#02070a';g.beginPath();g.moveTo(x+wd*.35,y);g.lineTo(x+wd*.35,y-ht*.5);g.arc(x+wd/2,y-ht*.5,wd*.15,M.PI,0);g.lineTo(x+wd*.65,y);g.fill();g.fillStyle='#061015';x+=wd+(40+r()*70)*s}
        else if(k<.65){const sz=(70+r()*30)*s;angel(g,x,y,sz);this.perch.push({x,y:y-sz*1.1});x+=(60+r()*60)*s}
        else{const z=(48+r()*30)*s;cross(g,x,y,z);this.perch.push({x,y:y-z});x+=(40+r()*60)*s}}});
    this.fore=layer(w,h,g=>{const y0=h*.9;g.beginPath();g.moveTo(-PAD,h+PAD);for(let x=-PAD;x<=w+PAD;x+=20)g.lineTo(x,y0+M.sin(x*.02)*8*s);g.lineTo(w+PAD,h+PAD);

  update(dt,p){super.update(dt,p);const {w,h,s,t}=this;this.lit+=((p.act?1:0)-this.lit)*dt*3;

      else{c.x+=c.vx*dt;c.y+=c.vy*dt;if(c.x<-60||c.x>w+60||c.y<-60)this.perchCrow(c)}}

    for(const q of this.rw)if(q.on){q.age+=dt;q.y+=q.vy*dt;q.x+=M.sin(t*2+q.ph)*18*dt;if(q.age>6)q.on=false}

      for(const d of [-1,1]){g.beginPath();g.moveTo(d*2,0);g.quadraticCurveTo(d*12,-14*f-6,d*26,-4*f);g.quadraticCurveTo(d*12,-2,-d*2,3);g.fill()}}

      b.x+=(b.vx+b.fx)*dt;b.by+=b.fy*dt;const dk=1-M.min(1,dt*1.6);b.fx*=dk;b.fy*=dk;b.by=clamp(b.by,h*.03,h*.8);

    for(const l of this.lv){l.y+=l.vy*dt;l.x+=(l.vx+M.sin(t*1.1+l.ph)*30*s)*dt;l.rot+=l.vr*dt;if(l.y>h+20){l.y=-20;l.x=rnd()*w}}
    this.lt+=dt;this.nl-=dt;if(this.nl<=0){this.lt=0;this.nl=C.light[0]+rnd()*C.light[1];this.strike()}
  }
  bat(g,b){g.save();g.translate(b.x+this.mx*10,b.y+this.my*5);g.scale(b.dir*b.sz,b.sz);const a=M.sin(this.t*b.ff+b.ph)*.8;g.fillStyle='#030107';
    g.beginPath();g.ellipse(0,2,4,6.5,0,0,TAU);g.fill();g.beginPath();g.arc(0,-5,3.2,0,TAU);g.fill();
    g.beginPath();g.moveTo(-3,-7);g.lineTo(-2,-12);g.lineTo(0,-8);g.lineTo(2,-12);g.lineTo(3,-7);g.fill(); // ears
    for(let sd=-1;sd<=1;sd+=2){g.save();g.scale(sd,1);g.translate(2,-1);g.rotate(-a);g.beginPath();g.moveTo(0,0);g.lineTo(12,-9);g.lineTo(27,-7);g.lineTo(22,-1);g.lineTo(20,4);g.lineTo(14,1);g.lineTo(10,6);g.lineTo(4,3);g.closePath();g.fill();g.restore()}
    g.restore()}
  monster(g,m,ox,oy){const t=this.t,ph=m.ph,sw=M.sin(t*.7+ph)*.05,ab=M.sin(t*1.1+ph)*3,dx=M.sin(t*.25+ph)*10*this.s,bob=M.abs(M.sin(t*1.4+ph))*2;
    g.save();g.translate(m.x+ox+dx,m.y+oy-bob);g.rotate(sw);g.scale(m.sz*m.fl,m.sz);g.fillStyle='#03010a';
    if(m.k===0){ // zombie: hunched, arms reaching forward
      g.fillRect(-11,-42,8,42);g.fillRect(3,-42,8,40);
      g.beginPath();g.moveTo(-14,-40);g.lineTo(-12,-80);g.lineTo(10,-82);g.lineTo(14,-40);g.closePath();g.fill();
      g.beginPath();g.arc(6,-91,9,0,TAU);g.fill();
      g.fillRect(8,-80+ab*.4,40,5);g.fillRect(8,-71+ab,38,5);
      g.beginPath();g.moveTo(-14,-40);g.lineTo(-10,-30);g.lineTo(-6,-40);g.lineTo(-2,-28);g.lineTo(4,-40);g.lineTo(8,-30);g.lineTo(14,-40);g.fill()}
    else{ // Frankenstein: flat head, neck bolts, stiff arms
      g.fillRect(-14,-14,12,14);g.fillRect(2,-14,12,14);g.fillRect(-12,-48,9,36);g.fillRect(3,-48,9,36);
      g.fillRect(-20,-92,40,48);g.fillRect(-6,-100,12,10);g.fillRect(-12,-126,24,28);
      g.fillRect(-18,-104,7,4);g.fillRect(11,-104,7,4);
      g.fillRect(18,-88,46,8);g.fillRect(18,-76+ab*.3,44,8)}
    g.restore()}
  spider(g,x,y,z){g.save();g.translate(x,y);g.scale(z/10,z/10);g.fillStyle=g.strokeStyle='#030106';g.lineWidth=1.5;
    g.beginPath();g.ellipse(0,6,6.5,8.5,0,0,TAU);g.fill();g.beginPath();g.arc(0,-4,4.5,0,TAU);g.fill();
    g.beginPath();for(let sd=-1;sd<=1;sd+=2)for(let k=0;k<4;k++){const ky=-3+k*3.2;g.moveTo(sd*4,ky);g.lineTo(sd*(11+k*2),ky-8);g.lineTo(sd*(19+k*2),ky+7+k)}g.stroke();
    g.restore()}
  draw(g){
    const {w,h,s,t,mx,my,p,C}=this;g.globalAlpha=1;g.globalCompositeOperation='source-over';
    putL(g,this.sky,mx*2,my*2);
    // moon + glow, then drifting clouds over it
    const fx=this.mX+mx*4,fy=this.mY+my*3,R=this.mR;
    g.globalCompositeOperation='lighter';glow(g,fx,fy,R*2.6,'255,110,30',.38);glow(g,fx,fy,R*4.2,'255,80,20',.12);
    g.globalCompositeOperation='source-over';g.globalAlpha=1;g.drawImage(this.moon,fx-R,fy-R,R*2,R*2);
    drawFog(g,this.cloud,w,h*.3,h*.34,t*9,.55);
    g.globalAlpha=1;putL(g,this.far,mx*7,my*4);
    // flickering house windows
    for(const q of this.win){const v=M.sin(t*2.1+q.ph)*M.sin(t*.37+q.ph*2),a=(.7+.3*M.sin(t*9+q.ph*3))*(v>.78?.12:1),x=q.x+mx*7,y=q.y+my*4;
      g.globalCompositeOperation='source-over';g.globalAlpha=a;g.fillStyle='#ffb347';g.fillRect(x-q.w/2,y-q.h/2,q.w,q.h);
      g.globalAlpha=1;g.fillStyle='#07020c';g.fillRect(x-1,y-q.h/2,2,q.h);g.fillRect(x-q.w/2,y-1,q.w,2);
      g.globalCompositeOperation='lighter';glow(g,x,y,q.h*1.5,'255,140,40',a*.5)}
    g.globalCompositeOperation='source-over';g.globalAlpha=1;
    for(const b of this.bt)this.bat(g,b);
    g.globalAlpha=1;putL(g,this.mid,mx*14,my*6);
    const fb=C.fogBack,ff=C.fogFront;
    for(let i=0;i<fb.length;i++){const f=fb[i];drawFog(g,this.tb[i],w,f.y*h,f.hh*h,t*f.sp+i*40+mx*20,f.a)}
    g.globalAlpha=1;for(const m of this.mo)this.monster(g,m,mx*18,my*8);
    for(let i=0;i<ff.length;i++){const f=ff[i];drawFog(g,this.tf[i],w,f.y*h,f.hh*h,t*f.sp+i*40+mx*34,f.a)}
    g.globalAlpha=1;putL(g,this.fore,mx*26,my*10);
    // jack-o'-lanterns: bodies, then additive glow + flickering carved holes
    for(let pass=0;pass<2;pass++){g.globalCompositeOperation=pass?'lighter':'source-over';
      for(const q of this.pk){const sp=this.pk0[q.v],D=q.sz,st=1+clamp(M.abs(q.vy)/(1500*s),0,.1),sw=D/st,sh=D*st,x=q.x+mx*26,y=q.gy-q.oy+my*10,top=y-sh*.8125,
          fl=.78+.22*M.sin(t*10+q.ph)*M.sin(t*2.7+q.ph*1.7)+.06*M.sin(t*23+q.ph*3);
        if(!pass){g.globalAlpha=1;g.drawImage(sp.b,x-sw/2,top,sw,sh)}
        else{glow(g,x,y-sh*.4,D*1.7,'255,130,30',.38*fl);g.globalAlpha=clamp(fl,0,1);g.drawImage(sp.h,x-sw/2,top,sw,sh);glow(g,x,y-sh*.42,D*.55,'255,220,120',.45*fl)}}}
    // spiders on threads
    g.globalCompositeOperation='source-over';g.strokeStyle='rgba(190,180,215,.5)';g.lineWidth=1;
    for(const q of this.sp){const L=q.len+M.sin(t*.5+q.ph)*q.amp,x=q.x+mx*32,sw=M.sin(t*.8+q.ph)*3*s;g.globalAlpha=1;g.beginPath();g.moveTo(x,-10);g.lineTo(x+sw,L);g.stroke();this.spider(g,x+sw,L,q.sz)}
    // falling leaves
    for(const l of this.lv){g.globalAlpha=.9;g.fillStyle=this.LCOL[l.c];g.save();g.translate(l.x+mx*30,l.y);g.rotate(l.rot);g.scale(.35+.65*M.abs(M.cos(t*2.2+l.ph)),1);
      const z=l.sz;g.beginPath();g.moveTo(0,-z);g.quadraticCurveTo(z*.9,-z*.2,0,z);g.quadraticCurveTo(-z*.9,-z*.2,0,-z);g.fill();g.restore()}
    // lightning flash (double strike) + bolt
    const lt=this.lt,fl=lt<.07?1:lt<.13?.15:lt<.2?.9:lt<.55?(.55-lt)/.35*.45:0;
    if(fl>0){g.globalCompositeOperation='lighter';g.globalAlpha=fl*.3;g.fillStyle='#bfa8ff';g.fillRect(0,0,w,h);
      if(this.bon&&lt<.3){const b=this.bolt;g.lineJoin='round';g.strokeStyle='#f4eeff';g.beginPath();for(let i=0;i<14;i++)i?g.lineTo(b[i*2]+mx*4,b[i*2+1]):g.moveTo(b[0]+mx*4,b[1]);
        g.lineWidth=12*s;g.globalAlpha=fl*.25;g.stroke();g.lineWidth=3*s;g.globalAlpha=fl;g.stroke()}}
  }
}


/* ====================== main: pointer, loop, UI ====================== */
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),buf=document.createElement('canvas'),bctx=buf.getContext('2d');
const SC=[new Cosmic(),new Tarot(0),new Tarot(1),new Cemetery(),new Hell(),new Temple(),new Love(),new Scan(),new Halloween()];
const TH=[{n:'ดวงชะตา',d:'จักรวาลนำทางชีวิตของคุณ',s:[0]},{n:'ไพ่ทาโรต์',d:'',s:[1,2]},{n:'เลขมงคล',d:'สุสานเที่ยงคืน กระซิบตัวเลขนำโชค',s:[3]},
  {n:'สะเดาะเคราะห์',d:'จากนรกสู่สวรรค์ ปลดเปลื้องเคราะห์กรรม',s:[4]},{n:'ไหว้พระขอพร',d:'วัดยามเย็น โคมลอยแห่งความหวัง',s:[5]},{n:'ความรัก',d:'สระบัวใต้แสงจันทร์สีชมพู',s:[6]},
  {n:'สแกนดวง',d:'ใบหน้าและลายมือ ถอดรหัสด้วยโหงวเฮ้ง',s:[7]},
  {n:'ฮาโลวีน',d:'คืนผีสิง ค้างคาวและฟักทองเรืองแสง',s:[8]}];
const P={x:0,y:0,sx:0,sy:0,nx:0,ny:0,tx:0,ty:0,down:false,cl:false,act:false};
const vig=mk(256,256),grain=mk(128,128);
{const g=vig.getContext('2d'),L=g.createRadialGradient(128,128,70,128,128,181);L.addColorStop(0,'rgba(0,0,0,0)');L.addColorStop(1,'rgba(0,0,0,.7)');g.fillStyle=L;g.fillRect(0,0,256,256);
 const q=grain.getContext('2d'),id=q.createImageData(128,128);for(let i=0;i<id.data.length;i+=4){const v=rnd()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}q.putImageData(id,0,0)}
const grainPat=ctx.createPattern(grain,'repeat');
let W=0,H=0,cur=-1,prev=-1,fade=1,ti=0,last=0,raf=0;

function resize(){DPR=M.min(devicePixelRatio||1,2);LD=M.min(DPR,1.5);W=innerWidth;H=innerHeight;
  cv.width=buf.width=M.round(W*DPR);cv.height=buf.height=M.round(H*DPR);
  if(!P.act){P.x=P.sx=W/2;P.y=P.sy=H*.6}
  if(cur>=0)SC[cur].resize(W,H);if(prev>=0)SC[prev].resize(W,H)}
function goto(i){if(i===cur)return;if(prev>=0)SC[prev].dispose();
  prev=cur;cur=i;SC[cur].init(W,H);fade=prev>=0?0:1;refresh()}
function setTheme(i){ti=i;const th=TH[i];goto(th.s.length>1?th.s[(rnd()*th.s.length)|0]:th.s[0])}
function refresh(){TH.forEach((x,k)=>x.b.classList.toggle('on',k===ti));
  document.getElementById('ttl').textContent=TH[ti].n;
  document.getElementById('sub').textContent=ti===1?(cur===1?'แม่มดแห่งราตรี':'พ่อมดแห่งหอคอย')+' · ไพ่จะบอกเรื่องราวของคุณ':TH[ti].d;
  tog.style.display=ti===1?'block':'none'}
const bar=document.getElementById('bar'),tog=document.getElementById('tog');
TH.forEach((th,i)=>{const b=document.createElement('button');b.textContent=th.n;b.onclick=()=>setTheme(i);bar.appendChild(b);th.b=b});
{const b=document.createElement('button');b.textContent='🎲 สุ่มธีม';b.onclick=()=>{let i;do i=(rnd()*TH.length)|0;while(i===ti);setTheme(i)};bar.appendChild(b)}
tog.onclick=()=>goto(cur===1?2:1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')setTheme((ti+1)%TH.length);else if(e.key==='ArrowLeft')setTheme((ti+TH.length-1)%TH.length)});
addEventListener('pointermove',e=>{P.x=e.clientX;P.y=e.clientY;P.tx=(e.clientX/W-.5)*2;P.ty=(e.clientY/H-.5)*2;P.act=true});
addEventListener('pointerdown',e=>{if(e.target.closest('#bar,#tog'))return;P.x=e.clientX;P.y=e.clientY;P.tx=(e.clientX/W-.5)*2;P.ty=(e.clientY/H-.5)*2;P.act=true;P.down=true;P.cl=true});
addEventListener('pointerup',()=>{P.down=false});
addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0}else if(!raf){last=performance.now();raf=requestAnimationFrame(frame)}});

function drawScene(sc,g){g.setTransform(DPR,0,0,DPR,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';g.save();sc.draw(g);g.restore()}
function frame(ts){
  raf=requestAnimationFrame(frame);const dt=M.min((ts-last)/1000||.016,.05);last=ts;
  const k=M.min(1,dt*3),k2=M.min(1,dt*9);P.nx+=(P.tx-P.nx)*k;P.ny+=(P.ty-P.ny)*k;P.sx+=(P.x-P.sx)*k2;P.sy+=(P.y-P.sy)*k2;
  const sp=dt*(reduce?.6:1);
  if(prev>=0){SC[prev].update(sp,P);fade+=dt/.8;if(fade>=1){SC[prev].dispose();prev=-1;fade=1}}
  SC[cur].update(sp,P);P.cl=false;
  if(prev>=0){drawScene(SC[prev],ctx);drawScene(SC[cur],bctx);const e=fade*fade*(3-2*fade);
    ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=e;ctx.globalCompositeOperation='source-over';ctx.drawImage(buf,0,0)}
  else drawScene(SC[cur],ctx);
  // post: vignette + subtle film grain
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.drawImage(vig,0,0,W,H);
  ctx.save();ctx.translate(-rnd()*128,-rnd()*128);ctx.globalAlpha=.05;ctx.fillStyle=grainPat;ctx.fillRect(0,0,W+128,H+128);ctx.restore();ctx.globalAlpha=1;
}
resize();setTheme(0);raf=requestAnimationFrame(frame);
})();
</script>
