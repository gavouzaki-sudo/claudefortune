<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="shrineGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#3a110e"/>
      <stop offset="60%" stop-color="#190605"/>
      <stop offset="100%" stop-color="#0e0303"/>
    </radialGradient>
    <linearGradient id="goldBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2b5"/>
      <stop offset="50%" stop-color="#e8b94a"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="vermilion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d62020"/>
      <stop offset="100%" stop-color="#800a0a"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#shrineGlow)" stroke="#e8b94a" stroke-width="10"/>
  <!-- Decorative Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(232, 185, 74, 0.25)" stroke-width="3" stroke-dasharray="12 8"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="rgba(232, 185, 74, 0.4)" stroke-width="2"/>
  
  <!-- Torii Shrine Gate / Palace Motif -->
  <!-- Roof Top Ridge curved -->
  <path d="M 96 150 Q 256 120 416 150 L 406 172 Q 256 148 106 172 Z" fill="url(#goldBeam)"/>
  <!-- Second Ridge -->
  <rect x="136" y="196" width="240" height="18" rx="6" fill="url(#vermilion)" stroke="url(#goldBeam)" stroke-width="2"/>
  <!-- Columns -->
  <path d="M 166 196 L 156 390 L 182 390 L 188 196 Z" fill="url(#vermilion)" stroke="url(#goldBeam)" stroke-width="3"/>
  <path d="M 346 196 L 356 390 L 330 390 L 324 196 Z" fill="url(#vermilion)" stroke="url(#goldBeam)" stroke-width="3"/>
  <!-- Central Holy Lantern (โคมมงคล) -->
  <circle cx="256" cy="286" r="54" fill="url(#vermilion)" stroke="url(#goldBeam)" stroke-width="4"/>
  <!-- Golden Character / Mystic Symbol (吉 / Luck) -->
  <text x="256" y="306" font-family="'Noto Serif Thai', serif, sans-serif" font-size="52" font-weight="bold" fill="#fff5cf" text-anchor="middle">吉</text>
  <!-- Base Stone Steps -->
  <rect x="120" y="390" width="272" height="18" rx="4" fill="url(#goldBeam)"/>
  <rect x="96" y="408" width="320" height="20" rx="6" fill="#2d160f" stroke="url(#goldBeam)" stroke-width="2"/>
</svg>
